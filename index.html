<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fo draws</title>
<style>
  :root{--ink:#1f1b17;--paper:#f6f1e7;--side:#efe7da;--muted:#6b6257;--line:#ddd2c2;--hover:#e7dccb;--active:#e3cfb8;--accent:#e0763c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink)}
  #app{display:flex;height:100%}
  #side{width:260px;flex:0 0 260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s ease}
  #side header{padding:18px 16px 10px}
  #side h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.01em}
  #side .sub{font-size:12px;color:var(--muted);margin-top:3px}
  #newBtn{margin:6px 12px 10px;padding:9px 12px;border:1px solid var(--line);background:var(--paper);border-radius:10px;font:inherit;font-size:13px;text-align:left;cursor:pointer;color:var(--ink)}
  #newBtn:hover{background:var(--hover)}
  #list{flex:1;overflow-y:auto;padding:4px 8px 16px}
  .group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 8px 6px}
  .item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.3}
  .item:hover{background:var(--hover)}
  .item.active{background:var(--active)}
  .item .meta{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .live-tag{display:inline-block;margin-left:6px;font-size:10px;padding:1px 6px;border-radius:999px;background:#d7eedf;color:#2b7a4b;vertical-align:1px}
  #stage{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  #title{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
  #bar{position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;letter-spacing:.02em}
  #dot{width:9px;height:9px;border-radius:50%;background:#c9bfb0;transition:background .3s}
  #dot.live{background:#3fae6a;animation:pulse 2s infinite}
  #dot.drawing{background:var(--accent)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,174,106,.5)}70%{box-shadow:0 0 0 8px rgba(63,174,106,0)}100%{box-shadow:0 0 0 0 rgba(63,174,106,0)}}
  #caption{position:absolute;top:40px;left:0;right:0;text-align:center;color:#3d362e;font-size:18px;opacity:0;transition:opacity .6s}
  #caption.show{opacity:1}
  #back{position:absolute;right:16px;bottom:12px;display:none;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
  #back.show{display:block}
  #menu{display:none;position:absolute;top:10px;left:10px;z-index:3;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:18px;cursor:pointer}
  @media (max-width:720px){
    #side{position:fixed;z-index:4;top:0;bottom:0;left:0;transform:translateX(-100%);box-shadow:0 0 30px rgba(0,0,0,.12)}
    #app.open #side{transform:none}
    #menu{display:block}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header><h1>fo draws</h1><div class="sub">your canvases</div></header>
    <button id="newBtn">+ New canvas</button>
    <nav id="list"></nav>
  </aside>
  <main id="stage">
    <button id="menu" aria-label="Show canvases">&#9776;</button>
    <canvas id="c"></canvas>
    <div id="title"></div>
    <div id="caption"></div>
    <button id="back">Back to live canvas</button>
    <div id="bar"><div id="dot"></div><span id="status">connecting...</span></div>
  </main>
</div>
<script>
// Fo draws on this page live. Fo sends small JSON messages to a live channel (ntfy.sh);
// every drawing message lands on the newest ("live") canvas, and every canvas is kept
// in the left sidebar so you can click back to any earlier drawing.
const TOPIC = "fo-draws-sk-7q2m9x";
const STORE = "fo-draws-canvases-v1";
const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");
const app = $("app"), dot = $("dot"), statusEl = $("status"), captionEl = $("caption");

// ---------- canvas history ----------
let canvases = [];        // [{id, label, createdAt, msgs:[{id, m}]}], oldest first
let viewId = null;        // canvas being shown on the right
const seen = new Set();   // live-channel message ids already filed into a canvas

function fmtLabel(ms){
  const d = new Date(ms);
  const day = d.toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric"});
  const t = d.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"});
  return day + ", " + t;
}
function liveCanvas(){ return canvases[canvases.length - 1]; }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(canvases)); } catch(e){} }
function indexSeen(){ seen.clear(); canvases.forEach(c => c.msgs.forEach(x => x.id && seen.add(x.id))); }
function merge(list){
  (list || []).forEach(c => {
    const mine = canvases.find(x => x.id === c.id);
    if (!mine) { canvases.push({id:c.id, label:c.label, createdAt:c.createdAt || Date.now(), msgs:[...(c.msgs||[])]}); return; }
    (c.msgs || []).forEach(x => { if (!mine.msgs.some(y => y.id === x.id)) mine.msgs.push(x); });
  });
  canvases.sort((a,b) => a.createdAt - b.createdAt);
  indexSeen();
}
function newCanvas(label, id, at){
  const createdAt = at || Date.now();
  const c = {id: id || ("c-" + createdAt), label: label || fmtLabel(createdAt), createdAt, msgs: []};
  if (!canvases.some(x => x.id === c.id)) canvases.push(c);
  save(); return c;
}

function renderList(){
  const list = $("list"); list.innerHTML = "";
  const live = liveCanvas();
  let lastGroup = "";
  [...canvases].reverse().forEach(c => {
    const g = new Date(c.createdAt).toDateString() === new Date().toDateString() ? "Today"
      : new Date(c.createdAt).toLocaleDateString("en-US", {month:"long", year:"numeric"});
    if (g !== lastGroup){ const h = document.createElement("div"); h.className = "group"; h.textContent = g; list.appendChild(h); lastGroup = g; }
    const b = document.createElement("button");
    b.className = "item" + (c.id === viewId ? " active" : "");
    b.innerHTML = "";
    b.appendChild(document.createTextNode(c.label));
    if (c === live){ const t = document.createElement("span"); t.className = "live-tag"; t.textContent = "live"; b.appendChild(t); }
    const meta = document.createElement("span"); meta.className = "meta";
    const n = c.msgs.filter(x => x.m && (x.m.p || x.m.px)).length;
    meta.textContent = n ? n + (n === 1 ? " stroke" : " strokes") : "empty";
    b.appendChild(meta);
    b.onclick = () => { show(c.id); app.classList.remove("open"); };
    list.appendChild(b);
  });
}

// ---------- drawing ----------
const pixels = new Map();
let grid = 32, done = [], scale = 1, ox = 0, oy = 0;
const X = x => ox + x * scale, Y = y => oy + y * scale;
function W(){ return canvas.clientWidth; } function H(){ return canvas.clientHeight; }
function resize(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W() * dpr; canvas.height = H() * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const s = Math.min(W(), H()) * 0.86;
  scale = s / 1000; ox = (W() - s) / 2; oy = (H() - s) / 2;
  redrawAll();
}
function style(st){ ctx.strokeStyle = st.c || "#1f1b17"; ctx.lineWidth = (st.w || 4) * scale * 1.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; }
function drawFull(st){
  const p = st.p; if(!p || !p.length) return;
  style(st); if (st.f) ctx.fillStyle = st.f;
  ctx.beginPath(); ctx.moveTo(X(p[0][0]), Y(p[0][1]));
  for (let i=1;i<p.length;i++) ctx.lineTo(X(p[i][0]), Y(p[i][1]));
  if (st.f){ ctx.closePath(); ctx.fill(); }
  ctx.stroke();
}
function drawPixels(){
  const cell = 1000 / grid;
  if (pixels.size){
    ctx.strokeStyle = "rgba(0,0,0,0.05)"; ctx.lineWidth = 1;
    for (let i=0;i<=grid;i++){ ctx.beginPath(); ctx.moveTo(X(i*cell),Y(0)); ctx.lineTo(X(i*cell),Y(1000)); ctx.stroke(); ctx.beginPath(); ctx.moveTo(X(0),Y(i*cell)); ctx.lineTo(X(1000),Y(i*cell)); ctx.stroke(); }
  }
  pixels.forEach((c, key) => { const [x,y] = key.split(",").map(Number); ctx.fillStyle = c; ctx.fillRect(X(x*cell)+0.5, Y(y*cell)+0.5, cell*scale-1, cell*scale-1); });
}
function redrawAll(){ ctx.clearRect(0,0,W(),H()); drawPixels(); done.forEach(drawFull); }
function applyInstant(m){
  if (m.clear){ done = []; pixels.clear(); }
  else if (m.grid){ grid = m.grid; }
  else if (m.px){ m.px.forEach(([x,y,c]) => c ? pixels.set(x+","+y, c) : pixels.delete(x+","+y)); }
  else if (m.p){ done.push(m); }
}
function show(id){
  const c = canvases.find(x => x.id === id) || liveCanvas(); if (!c) return;
  viewId = c.id; done = []; pixels.clear(); grid = 32;
  c.msgs.forEach(x => applyInstant(x.m));
  redrawAll();
  $("title").textContent = c.label;
  $("back").classList.toggle("show", c !== liveCanvas());
  renderList();
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function animate(st){
  return new Promise(resolve => {
    const p = st.p;
    if(!p || p.length < 2){ done.push(st); drawFull(st); return resolve(); }
    let total = 0; const seg = [];
    for (let i=1;i<p.length;i++){ const d = Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]); seg.push(d); total += d; }
    const dur = Math.max(250, total / (st.s || 0.9)), t0 = performance.now();
    function frame(now){
      const k = Math.min(1, (now - t0) / dur), target = total * (1 - Math.pow(1-k, 2));
      redrawAll(); style(st);
      ctx.beginPath(); ctx.moveTo(X(p[0][0]), Y(p[0][1]));
      let acc = 0;
      for (let i=1;i<p.length;i++){
        if (acc + seg[i-1] <= target){ ctx.lineTo(X(p[i][0]), Y(p[i][1])); acc += seg[i-1]; }
        else { const r = (target-acc)/seg[i-1]; ctx.lineTo(X(p[i-1][0]+(p[i][0]-p[i-1][0])*r), Y(p[i-1][1]+(p[i][1]-p[i-1][1])*r)); break; }
      }
      ctx.stroke();
      if (k < 1) requestAnimationFrame(frame); else { done.push(st); redrawAll(); resolve(); }
    }
    requestAnimationFrame(frame);
  });
}

// ---------- live channel ----------
const queue = []; let busy = false;
async function pump(){
  if (busy) return; busy = true; dot.className = "drawing"; statusEl.textContent = "fo is drawing";
  while (queue.length){
    const {id, m} = queue.shift();
    if (m.say !== undefined){ captionEl.textContent = m.say; captionEl.classList.toggle("show", !!m.say); continue; }
    if (m.new !== undefined){ const c = newCanvas(typeof m.new === "string" && m.new ? m.new : null, m.cid, m.at); show(c.id); continue; }
    if (m.save !== undefined) continue; // every canvas is already kept; nothing extra to do
    let live = liveCanvas(); if (!live) live = newCanvas();
    live.msgs.push({id, m}); save();
    if (viewId !== live.id) show(live.id);
    if (m.px){ for (const [x,y,c] of m.px){ c ? pixels.set(x+","+y, c) : pixels.delete(x+","+y); redrawAll(); await wait(m.d || 30); } }
    else if (m.p){ await animate(m); }
    else { applyInstant(m); redrawAll(); }
    renderList();
  }
  busy = false; dot.className = "live"; statusEl.textContent = "listening for fo";
}
function connect(){
  // since=all replays the last few hours, so drawings sent while this page was closed still show up.
  const es = new EventSource("https://ntfy.sh/" + TOPIC + "/sse?since=all");
  es.onopen = () => { dot.className = "live"; statusEl.textContent = "listening for fo"; };
  es.onmessage = e => {
    try {
      const ev = JSON.parse(e.data);
      if (ev.event !== "message" || !ev.message || seen.has(ev.id)) return;
      seen.add(ev.id);
      const m = JSON.parse(ev.message);
      (Array.isArray(m) ? m : [m]).forEach((x, i) => queue.push({id: ev.id + (i ? "-" + i : ""), m: x}));
      pump();
    } catch(err) { console.warn("skipped a message", err); }
  };
  es.onerror = () => { dot.className = ""; statusEl.textContent = "reconnecting..."; };
}

// "+ New canvas" goes through the live channel, so every open copy of the page switches together.
$("newBtn").onclick = () => {
  const at = Date.now();
  fetch("https://ntfy.sh/" + TOPIC, {method:"POST", body: JSON.stringify({new: fmtLabel(at), cid: "c-" + at, at})})
    .catch(() => { const c = newCanvas(null, "c-" + at, at); show(c.id); });
  app.classList.remove("open");
};
$("back").onclick = () => show(liveCanvas().id);
$("menu").onclick = () => app.classList.toggle("open");
addEventListener("resize", resize);

(async function start(){
  try { merge(JSON.parse(localStorage.getItem(STORE) || "[]")); } catch(e){}
  try { const r = await fetch("history.json?ts=" + Date.now()); if (r.ok) merge((await r.json()).canvases); } catch(e){}
  if (!canvases.length) newCanvas();
  save(); resize(); show(liveCanvas().id); connect();
})();
</script>
</body>
</html>

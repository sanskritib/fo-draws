<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fo draws</title>
<style>
  html,body{margin:0;height:100%;background:#f6f1e7;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  #bar{position:fixed;left:16px;bottom:14px;display:flex;align-items:center;gap:8px;color:#6b6257;font-size:13px;letter-spacing:.02em}
  #dot{width:9px;height:9px;border-radius:50%;background:#c9bfb0;transition:background .3s}
  #dot.live{background:#3fae6a;box-shadow:0 0 0 0 rgba(63,174,106,.6);animation:pulse 2s infinite}
  #dot.drawing{background:#e0763c}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,174,106,.5)}70%{box-shadow:0 0 0 8px rgba(63,174,106,0)}100%{box-shadow:0 0 0 0 rgba(63,174,106,0)}}
  #caption{position:fixed;top:18px;left:0;right:0;text-align:center;color:#3d362e;font-size:18px;opacity:0;transition:opacity .6s}
  #caption.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="caption"></div>
<div id="bar"><div id="dot"></div><span id="status">connecting...</span></div>
<script>
// Fo draws on this page live. Fo sends strokes to a live channel; the page draws each one stroke by stroke.
const TOPIC = "fo-draws-sk-7q2m9x";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const dot = document.getElementById("dot");
const statusEl = document.getElementById("status");
const captionEl = document.getElementById("caption");
const pixels = new Map(); // "x,y" -> color, for pixel art mode
let grid = 32;            // pixel grid size (grid x grid)
const done = [];          // finished strokes, kept so a resize can redraw them
const queue = [];         // strokes waiting to be drawn
let busy = false;

// Fo draws in a 1000 x 1000 space; it gets centered and scaled to fit the window.
let scale = 1, ox = 0, oy = 0;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const s = Math.min(innerWidth, innerHeight) * 0.9;
  scale = s / 1000; ox = (innerWidth - s) / 2; oy = (innerHeight - s) / 2;
  redrawAll();
}
const X = x => ox + x * scale, Y = y => oy + y * scale;

function style(st){
  ctx.strokeStyle = st.c || "#1f1b17";
  ctx.lineWidth = (st.w || 4) * scale * 1.4;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
}
function drawFull(st){
  const p = st.p; if(!p || !p.length) return;
  style(st);
  if (st.f) { ctx.fillStyle = st.f; }
  ctx.beginPath(); ctx.moveTo(X(p[0][0]), Y(p[0][1]));
  for (let i=1;i<p.length;i++) ctx.lineTo(X(p[i][0]), Y(p[i][1]));
  if (st.f) { ctx.closePath(); ctx.fill(); }
  ctx.stroke();
}
function drawPixels(){
  const cell = 1000 / grid;
  if (pixels.size){
    ctx.strokeStyle = "rgba(0,0,0,0.05)"; ctx.lineWidth = 1;
    for (let i=0;i<=grid;i++){ ctx.beginPath(); ctx.moveTo(X(i*cell),Y(0)); ctx.lineTo(X(i*cell),Y(1000)); ctx.stroke(); ctx.beginPath(); ctx.moveTo(X(0),Y(i*cell)); ctx.lineTo(X(1000),Y(i*cell)); ctx.stroke(); }
  }
  pixels.forEach((c, key) => { const [x,y] = key.split(",").map(Number); ctx.fillStyle = c; ctx.fillRect(X(x*cell)+0.5, Y(y*cell)+0.5, cell*scale-1, cell*scale-1); });
}
function redrawAll(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  drawPixels();
  done.forEach(drawFull);
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// Animate one stroke along its length, so it looks hand drawn.
function animate(st){
  return new Promise(resolve => {
    const p = st.p;
    if(!p || p.length < 2){ done.push(st); drawFull(st); return resolve(); }
    let total = 0; const seg = [];
    for (let i=1;i<p.length;i++){ const d = Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]); seg.push(d); total += d; }
    const speed = st.s || 0.9;              // drawing-space units per ms
    const dur = Math.max(250, total / speed);
    const t0 = performance.now();
    function frame(now){
      const k = Math.min(1, (now - t0) / dur);
      const target = total * (1 - Math.pow(1-k, 2)) ; // ease out a little
      redrawAll();
      style(st);
      ctx.beginPath(); ctx.moveTo(X(p[0][0]), Y(p[0][1]));
      let acc = 0;
      for (let i=1;i<p.length;i++){
        if (acc + seg[i-1] <= target){ ctx.lineTo(X(p[i][0]), Y(p[i][1])); acc += seg[i-1]; }
        else { const r = (target-acc)/seg[i-1]; ctx.lineTo(X(p[i-1][0]+(p[i][0]-p[i-1][0])*r), Y(p[i-1][1]+(p[i][1]-p[i-1][1])*r)); break; }
      }
      ctx.stroke();
      if (k < 1) requestAnimationFrame(frame);
      else { done.push(st); redrawAll(); resolve(); }
    }
    requestAnimationFrame(frame);
  });
}

async function pump(){
  if (busy) return; busy = true; dot.className = "drawing"; statusEl.textContent = "fo is drawing";
  while (queue.length){
    const m = queue.shift();
    if (m.clear){ done.length = 0; pixels.clear(); redrawAll(); continue; }
    if (m.grid){ grid = m.grid; redrawAll(); continue; }
    if (m.px){ for (const [x,y,c] of m.px){ if (c) pixels.set(x+","+y, c); else pixels.delete(x+","+y); redrawAll(); await wait(m.d || 30); } continue; }
    if (m.say !== undefined){ captionEl.textContent = m.say; captionEl.classList.toggle("show", !!m.say); continue; }
    if (m.p) await animate(m);
  }
  busy = false; dot.className = "live"; statusEl.textContent = "listening for fo";
}

function connect(){
  const es = new EventSource("https://ntfy.sh/" + TOPIC + "/sse");
  es.onopen = () => { dot.className = "live"; statusEl.textContent = "listening for fo"; };
  es.onmessage = e => {
    try {
      const ev = JSON.parse(e.data);
      if (ev.event !== "message" || !ev.message) return;
      const m = JSON.parse(ev.message);
      (Array.isArray(m) ? m : [m]).forEach(x => queue.push(x));
      pump();
    } catch(err) { console.warn("skipped a message", err); }
  };
  es.onerror = () => { dot.className = ""; statusEl.textContent = "reconnecting..."; };
}

addEventListener("resize", resize);
resize(); connect();
</script>
</body>
</html>

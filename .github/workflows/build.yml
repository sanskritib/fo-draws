name: build site

# Builds the React + TypeScript app in app/ and commits the output (index.html + assets/)
# to the repo root, which is what GitHub Pages serves.
on:
  push:
    branches: [main]
    paths: ["app/**", "package.json", "vite.config.ts", "tsconfig.json", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: rm -rf assets
      - run: npm run build
      - name: commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets
          git commit -m "build site" || echo "nothing to commit"
          git push
